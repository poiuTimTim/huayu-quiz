.bankrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e7edf5}.bankrow .mini{max-height:40px;overflow:hidden}.bankrow button{flex-shrink:0}a{color:#245bc0}</style><div class="wrap"><header><h1>華語文教學｜歷屆試題刷題</h1><p>2016–2020 教育部對外華語教學能力認證考試・原題練習</p></header><div class="panel"><div class="toolbar"><label>年份 <select id="year"></select></label><label>模式 <select id="mode"><option value="study">逐題練習（立即批改）</option><option value="exam">模擬考（最後批改）</option><option value="wrong">錯題庫重練（跨年份）</option><option value="mixed">跨年份隨機練習（50題）</option></select></label><button id="reset">重置作答</button><button id="reshuffle" class="hide">重新抽取 50 題</button></div><div class="stats" style="margin-top:17px"><div class="stat">已作答<b id="count">0/25</b></div><div class="stat">正確率<b id="accuracy">—</b></div><div class="stat">錯題數<b id="misses">0</b></div></div></div><div class="panel" id="quiz"><div class="toolbar" style="justify-content:space-between"><b id="qtitle"></b><span class="pill" id="tag"></span></div><div class="progress"><div id="bar"></div></div><div id="stem" class="q"></div><div id="choices"></div><div id="feedback" class="feedback hide"></div><div class="nav"><button id="prev">上一題</button><button class="primary" id="submit">確認答案</button><button id="next">下一題</button></div></div><div class="panel"><h3>錯題庫 <span class="pill" id="bankCount">0 題</span></h3><p class="mini">跨年份累積錯題，答對重練題後自動移出；不受重新抽題影響。紀錄僅保存在此裝置的瀏覽器。</p><div id="bankList"></div><button id="clearBank">清空錯題庫</button></div><div class="panel"><h3>題號導覽</h3><div class="grid" id="numbers"></div></div><footer>混合練習每年隨機抽取 10 題，共 50 題；保留原始題目與選項。練習進度儲存在目前瀏覽器。<br>來源：使用者提供之 2016–2020 年教育部原始試題及官方解答。已核對的解析附來源；未完成多方查證的題目僅顯示官方答案。2020 年 25 題已逐題轉寫為文字，並依原始試卷核對。資料保存在本機瀏覽器中，清除網站資料可能導致紀錄消失。</footer></div><script>
const DATA={"2016":[{"n":1,"q":"「學習語言形式的時候，察覺是必須的，通過潛意識的方式不可能學會語言，一旦察 覺到，輸入就會變成吸收(intake)。」這是下列哪一個假說的主張？","o":["語言輸入假說(the Input Hypothesis)","語言輸出假說(the Output Hypothesis)","注意力假說(the Noticing Hypothesis)","自然順序假說(the Natural Order Hypothesis)"],"a":"C"},{"n":2,"q":"在某個聽力教學的課堂中，兩位教師有不同做法：一個是讓學生從句子聽起，進而到 整個段落；另一個是讓學生先聽整個段落，再聽一個個句子。這兩種做法的差異是基 於什麼理念？","o":["語言處理的容量","語言處理的難易度","語言處理的認知模式","語言處理的時間長短"],"a":"C"},{"n":3,"q":"當學生寫出「我喜歡那本書你買的」這樣的句子時，應如何診斷這個問題？","o":["學生對於「的」的用法有問題","學生對於話題句的用法有問題","學生對於動詞出現的位置有問題","學生對於複雜名詞短語的結構有問題"],"a":"D"},{"n":4,"q":"某俄語中心的網站上，將自己的課程分為九級，另外也將這個分級對應到 CEFR 的能 力架構及 ACTFL 的能力架構。這種做法的目的為何？","o":["提供學習者可以選用的教材。","顯示該語言中心採用歐美的教學系統。","顯示該語言中心使用的是歐洲或美國出版的教材。","提供學習者更多的訊息，以便清楚自己的學習進展。"],"a":"D"},{"n":5,"q":"學生說： 「我昨天不去上課，因為我生病了。」以下四種教師的糾錯方法，何者屬於重 述型糾錯法(recasts)？","o":["師：「我昨天沒去上課，因為我生病了。」","師：「過去的事，否定要用什麼？」","師：「不能用『不』，要用『沒』 。」","師：「昨天不去上課？（ 「不」提高語調）」"],"a":"A"},{"n":6,"q":"在美國編製的華語測驗中，有一個考題是「你手腕上 的那支手錶很漂亮」， 選項的設計是(1)帶，(2)袋，(3)戴，(4)穿。對於選項(4)的設計理念，下列哪一個敘述 正確？","o":["為了測試同音詞","該選項沒有誘答力","考量母語干擾的因素","需要一個高頻動詞做為誘答選項"],"a":"C"},{"n":7,"q":"關於多義詞的教學，有些人主張一次教一個詞彙意義，減少學習者的負擔；有些人主 張不要只限於教一個詞彙意義，認為學習者可以觸類旁通。下列哪一個敘述跟這兩種 主張的考量無關？","o":["考量學習效率","考量教學的便利性","考量不同的學習模式","考量工作記憶容量有限"],"a":"B"},{"n":8,"q":"期末時學生將他們平常所做的作業做成學習檔案，交給教師打分數。這是屬於哪一種 評量方式？","o":["同儕評量","診斷評量","形成性評量","總結性評量"],"a":"C"},{"n":9,"q":"閱讀課程中，選擇適合學習者程度的篇章非常重要。下列何者不是影響篇章可讀性的 因素？","o":["動詞數量","連詞多寡","篇章長短","詞語難易度"],"a":"A"},{"n":10,"q":"就語言能力的發展而言，一般都是從詞、短語、句到語篇的歷程。據此，下列哪一個 語法點在教學時應最晚出現？","o":["從…到…","一邊…一邊…","一來…二來…","狀態動詞+極了/得不得了/得很"],"a":"C"},{"n":11,"q":"下列何者不是平衡雙語者可能優於單語者的認知能力？","o":["後設認知能力","文法容忍度","詞彙語意處理速度","壓抑無效訊息的能力"],"a":"C"},{"n":12,"q":"關於 Krashen 的監控理論，下列敘述何者正確？","o":["語言學習跟語言習得是同義詞。","溝通往往能夠促進學習者語言能力的提升。","給予學習者較大的壓力，能幫助其學習成效。","存在於學習者中詞素的自然習得順序，是由所處環境所支配。"],"a":"B"},{"n":13,"q":"教師要學生讀五則關於學校餐廳的網路留言，然後說一說同意或不同意哪一則的說法 以及理由。這個活動符合下列哪一個教學目標？","o":["能寫出表達意見的文章","能聽懂任何口語言談內容","能比較後說出自己支持的理由","能快速瀏覽複雜且詳細的文章"],"a":"C"},{"n":14,"q":"Lennon (1991)把偏誤(error) 類型區分為四大類，「這家小籠包不錯吃。」是屬於何種 偏誤類型？","o":["誤加(addition)","遺漏(omission)","替代(mis-selection)","錯序(mis-ordering)"],"a":"C"},{"n":15,"q":"「①學生先聆聽一段完整的文句。」→「②試著找尋學過的詞語，猜測語句的意思。」 →「③聆聽／閱讀一些問題。」→「④再聽一次完整文句。」→「⑤試著回答問題。」 這種聽力訓練是下列哪一種教學技巧？","o":["上而下的練習","下而上的練習","互動整合的練習","基模轉化的練習"],"a":"A"},{"n":16,"q":"關於口語教學類型，下列敘述何者正確？","o":["「模仿式(Imitative)」教學主要是進行互動式練習。","「回應式(Responsive)」教學以教材內容簡答為主，很少發展成真正對話。","「交流式(Transaction-Dialogue)」教學多半是兩人一組練習，不適合小組活動方式。","「人際式(Interpersonal- Dialogue)」教學適合中高級學生，其語體包括正式口語與書 面語。"],"a":"B"},{"n":17,"q":"Christine Nuttall (1996)提出三個選擇閱讀材料的標準，下列敘述何者不正確？","o":["必須採用真實語料，避免為情造文。","選文以符合學生的興趣和需求為首要。","內容必須兼顧其他學科和語言能力。","文本可以有點難，稍微高出學生程度無妨。"],"a":"A"},{"n":18,"q":"關於課後習作或課堂評量，下列敘述何者應避免？","o":["所有詞句都以課本內容為主。","以課為單位，螺旋練習，鞏固教學目標。","注意字句的數量，程度越高，每句的字數越少，以精簡為要。","聽力錄音要注意程度和語速的關係，並避免過多記憶性的題目。"],"a":"C"},{"n":19,"q":"相較於自然環境中的語言習得，關於華語文課堂教學的優點，下列敘述何者正確？","o":["能使學生掌握全面且詳盡的語法規則","能塑造真實交際環境及真正交際活動","能完全提供符合真實生活的語言材料","能透過安排的設計活動收到較佳效果"],"a":"D"},{"n":20,"q":"華語文化教學中，以跨文化能力為導向的寓言故事篇章，其選錄的主要原則不包括下 列何者？","o":["經典文學出處","符合比較文學原則","貼近學生生活經驗","表現華人重要文化思想"],"a":"B"},{"n":21,"q":"關於電腦化適性測驗的特點，下列敘述何者錯誤？","o":["題目先經過預試，試題品質通常較高。","以試題反應理論(IRT)為基礎進行開發。","參與測驗的考生回答同一試卷，具公平性。","運用電腦為考試媒介，捨棄傳統紙筆形式。"],"a":"C"},{"n":22,"q":"關於教學中能有效幫助學習者學習的方法，下列敘述何者錯誤？","o":["使用具體的詞比抽象的詞更容易記憶。","由呈現的圖像喚起表徵，也能喚起腦中的詞彙。","上下文關係的訊息需連貫，訊息孤立容易被錯誤理解。","學習者對複雜的內容用口語比印刷語詞、圖像更適宜。"],"a":"D"},{"n":23,"q":"關於各級華語教學重點，下列敘述何者錯誤？","o":["初級教學重點為認識聲母、韻母、聲調。","初級、中級華語以日常生活語言習得為主。","中高級、進階華語以文化議題為學習重點。","高級學習階段是發展閱讀能力的重要關鍵時期。"],"a":"D"},{"n":24,"q":"關於「學習風格」(learning style)，下列敘述何者錯誤？","o":["場獨立型學習者對人際關係較感興趣","場依賴型學習者傾向於把刺激視為一個整體組型","場依賴型學習者在自然環境下學習外語更易成功","場獨立型學習者喜歡嘗試錯誤的學習與歸納性的學習"],"a":"A"},{"n":25,"q":"關於 CFL (Chinese as a Foreign Language)與 CSL (Chinese as a Second Language)，下列 敘述何者正確？","o":["在 CFL 環境中的學習者，離開課堂後，仍處在標的語的環境中。","CSL 環境中的學習者，能在日常生活中接觸到豐富的文化訊息。","CFL 環境的學習者其動機多屬融合型(Integrative)，學習者須能掌握基本的語言結 構和定量的常用詞彙。","CSL 的學習者，在學校裡仍是以自己的母語做為學習媒介，華語僅是特定課堂的 學習標的。 ※下列是非題請在答案卡上以 2B 鉛筆作答"],"a":"B"}],"2017":[{"n":1,"q":"關於華語文教材的相關敘述，下列何者最為合適？","o":["初級課程教材可利用生活的實用會話為重心，並可以語境化的方式配合句型練習。","目前臺灣各華語中心主要以教材級數定位教學，而非課程級數定位教學。","臺灣的小學國語課本有很多珍貴的兒童語料，是華語中心初級班的主要教材。","報章雜誌、招牌、菜單等皆為常見的真實語料，是適切的華語文初級主要教材。"],"a":"A"},{"n":2,"q":"第二語言課堂中，教師語言是學生理解與模仿的標的。關於教師課堂語言特徵之敘述， 下列何者最不合適？","o":["為符合「可理解輸入」的原則，教師應動態調整課堂語言。","使用直述句多於疑問句，而且大量應用從屬句。","適時調整語速，發音清晰、易懂。","於課堂互動時交互調整、並進行語義協商。"],"a":"B"},{"n":3,"q":"第二語言習得過程中，學習者運用各種學習策略，持續進步地發展介於母語和目標語 之間的動態語言系統，即為中介語。關於中介語之敘述，下列何者正確？","o":["有些偏誤模式根深蒂固地深植於學習者的語言表現，此為化石化現象(fossilization)。","中介語可以觀察分析，但無法記錄成語料庫的語言系統。","中介語系統是以教師為中心的思考，並以行為主義及生成語法為理論基礎。","中介語僅是學習過程中的片段，無法反映學習過程中有規律的變化。"],"a":"A"},{"n":4,"q":"關於「詞語教學法(Lexical Approach)」的敘述，就華語教學而言，下列哪一種教學方 法最可提升學習者的詞彙量？","o":["應結合對比分析進行教學。","應注意詞彙的其他俚語用法。","應注重詞語搭配、共現教學。","應注重慣用語與熟語的教學。"],"a":"C"},{"n":5,"q":"關於華語篇章教學之敘述，下列敍述何者最不合適？","o":["銜接(cohesion)為將句子或話語等較大單位聯繫起來的表層結構特徵。","連貫(coherence)是句子內部命題、語義邏輯的關係。","篇章係由兩個以上的句子組成，著重句子之間的銜接與連貫現象。","篇章中必有銜接，不一定有連貫。"],"a":"D"},{"n":6,"q":"華語文教材的課文編寫原則，最無須考慮哪一個環節？","o":["漢字認讀難易度的問題。","生詞在課文中的分布。","話題是否具有實用性。","句型語法的使用頻率。"],"a":"A"},{"n":7,"q":"下面有關外籍生華語能力測驗分級與標準的敘述，何者正確？","o":["是使用標準化且固定的題型來檢測受試者的語言能力。","是一種標準參照的測驗，受試者考完能知道是否達到某項學習目標。","試題的難易度會依照受試者的居住地而稍加調整，故測驗信度極為可靠。","試題涵蓋不同主題與情境，能有效地檢測受試者的溝通能力，故可達到標準效度。"],"a":"A"},{"n":8,"q":"「我不會被你這句話嚇倒。」這個句子受到了英文影響，屬於非規範性的中文語法， 依據 Lennon(1991)的語言錯誤類型分析，應為何種錯誤？","o":["誤加(addition)。","遺漏(omission)。","替代(mis-selection)。","錯序(mis-ordering)。"],"a":"D"},{"n":9,"q":"現代中文詞組可以用「做＋名詞」來表示進行某一項事件，例如： 「做實驗」 、「做報告」 、 「做節目」等，當前臺灣社會常聽到「做清掃」、 「做收費」、 「做領取」……，這是語 言習得的哪種過程？","o":["語內轉化。","外在干擾。","過度類化。","語用失誤。"],"a":"C"},{"n":10,"q":"課程內容以「氣象報告」 、「求職信」 、「申請信用卡」等主題為範例，並落實「溝通教 學法」 ，上述教學屬於哪一種教學大綱？","o":["認知語法取向教學大綱。","能力本位式教學大綱。","任務導向式教學大綱。","文法需求式教學大綱。"],"a":"C"},{"n":11,"q":"在漢字中，有許多不同偏旁的字都來自相同的「字根」。因此，漢字教學時常讓學習 者熟悉字根的意義，可幫助學習者自學漢字。上述之教學觀點立論是基於以下哪一個 學派？","o":["結構主義學派。","行為主義學派。","認知心理學派。","人本主義學派。"],"a":"C"},{"n":12,"q":"以下哪一種教學策略最適合華語量詞教學？","o":["通過詞素推衍解釋詞義。","說明上下文語境解釋用法。","利用詞義的搭配組合條列關係。","採用語言對比模式理解不同含義。"],"a":"C"},{"n":13,"q":"如果教學上採用全語言(whole language)教學觀，那麼教師應該不會使用下列哪一種教 學方式？","o":["幫助學生注意語句、情感、語調等面向。","注重聽說讀寫四項語言技能之統整訓練。","採取由下而上(bottom-up)的學習模式。","強調使用真實自然的語言來教學。"],"a":"C"},{"n":14,"q":"漢字教學若採取「集中識字法」 ，應會採取下列哪一種教學活動？","o":["在教學時將相同字義的字歸納在一起。","在教學時讓學生透過閱讀文章來認生字。","利用押韻方式將文字結構及韻律帶入學習中。","設計遊戲讓學生比較形近字、近義字或同音字。"],"a":"D"},{"n":15,"q":"我國兒童華語文能力測驗(CCCC)的能力等級分為三級，如果一位學習者的能力達到 「茁壯級」，那麼該生之能力：","o":["等同於歐洲共同語言參考標準(CEFR)的 A1 級。","等同於美國外語協會 ACTFL 的中級(Intermediate)。","能理解與個人生活經驗相關的主題及簡單敘事短文。","估計大約擁有 1500 個字彙量。"],"a":"C"},{"n":16,"q":"以下哪一個例句中的「還是」，其意義與其他三句不同？","o":["二十年不見，他還是老樣子。","這個案子警方還是沒查出結果。","自己摸索浪費時間，還是請教別人吧。","有這麼可口的小菜，他還是忍不住倒了一杯酒。"],"a":"C"},{"n":17,"q":"運用歌謠教學法進行華語教學，容易造成學習者在下列哪一方面掌握較為不佳？","o":["聲母不清楚。","韻母難分辨。","聲調不標準。","語法不正確。"],"a":"C"},{"n":18,"q":"當學習者忘記「在～方面」的正確用法，而說出「在房間設備部分，有電視、冰箱、 冷氣……」，此時他採用了哪一種溝通技巧？","o":["語碼轉換(Code Switching)。","迴避策略(Avoidance Strategies)。","聯想學習(Associative Learning)。","語言變異(Language Variability)。"],"a":"B"},{"n":19,"q":"在聽力課中，訓練學生掌握「不但」或「可是」等關鍵詞，可發展學生在聽力訓練中 哪一方面的能力?","o":["訓練學生注意細節與精聽的能力。","訓練學生快速回應的能力。","訓練學生記憶儲存的能力。","訓練學生預測下文的能力。"],"a":"D"},{"n":20,"q":"為了避免學生的母語會干擾目標語的學習，所以課堂上師生都不使用母語，而只用目 標語的是哪一種語言教學法？","o":["直接教學法(The Direct Method)。","默示教學法(The Silent Way Method)。","社群語言教學法(Community Language Learning Method)。","情緒解放教學法(Desuggestopedia Method)。"],"a":"A"},{"n":21,"q":"關於「沉浸式(Immersion)教學」之敘述，下列何者最為合適？","o":["沉浸式教學的目的是在培養雙語言、雙文化的素養與能力。","課程實施的方法是把母語當成一種學習其他學科及養成教育的工具。","課程之沉浸程度與年齡成正比。","最早的沉浸式課程源自法國，並逐漸傳播到世界各地。"],"a":"A"},{"n":22,"q":"口語教學的訓練方法有單項訓練和綜合訓練兩大類，以下哪一種華語教學方式可用來 進行口語綜合訓練？","o":["詞彙教學。","語法教學。","朗讀課文。","角色扮演。"],"a":"D"},{"n":23,"q":"下列哪一項敘述和 Krashen 所提出的假說無關？","o":["學習者在學習時會進行適度的語言監控並自我修正。","語言規則的習得是有順序的。","第二語言或外語學習，如同第一語言習得，亦會有一種學會形式或規則的自然順序。","兒童大多靠模仿學習，應可以提供大量機械式練習和活動。"],"a":"D"},{"n":24,"q":"許慎《說文解字》:「名，自命也。人人口夕。夕，冥也，冥不相見，故以口自名。」由 此可知， 「名」的構字原則是六書中的哪一類?","o":["象形。","會意。","轉注。","指事。"],"a":"B"},{"n":25,"q":"泰國、印尼等國的學習者說華語時，常將「ㄐㄑㄒ」發成「ㄗㄘㄙ」 ，最主要原因是 什麼？","o":["受母語負遷移影響。","連音變化掌握不足。","缺乏華語重音知識。","使用漢語拼音系統。 ※下列是非題請在答案卡上以 2B 鉛筆作答"],"a":"A"}],"2018":[{"n":1,"q":"有關第二語言教學法的流派，下列敘述何者正確？","o":["文法翻譯法強調的是口語聽說的能力","直接教學法重視的是閱讀寫作的能力","聽說教學法採取模仿、重複以及記憶","肢體反應教學法不容許學生口語錯誤"],"a":"C"},{"n":2,"q":"漢字教學有「集中識字」法，下列何者不屬於此一教學法？ 、「做」","o":["從「人」部找出「個」 、「他」等字，圈出同樣部首 、「子」、","從「木」部畫個圓圈，讓它和「木」 「口」等相加","從「歌」字編成「哥哥愛唱歌，我也愛唱歌」的口訣教學","從「你吃飯了沒」，分析出「吃飯」 ，再析出「飯」來教學"],"a":"D"},{"n":3,"q":"下列有關華語語音的敘述，何者正確？","o":["在聲母中，ㄇ、ㄋ、ㄌ屬於濁音","在韻母中，ㄞ、ㄠ、ㄤ屬複韻母","「一」和「不」是屬於輕聲變調","「ㄩ」之後的ㄦ化韻可讀為ㄩㄦ"],"a":"A"},{"n":4,"q":"王老師上華語課時常常以祈使句發號施令，教導學生動詞及動詞詞組的意思。但是王 老師不做任何學生母語翻譯，希望學生直接用華語思考並透過動作表達。請問王老師 的教學法最趨近於下列何種教學法？","o":["聽說教學法（The Audiolingual Method）","暗示教學法（Suggestopedia）","全語言教學法（Whole Language Approach）","肢體反應教學法（Total Physical Response）"],"a":"D"},{"n":5,"q":"語言協商可分成三種類型： 「理解檢測（comprehension checks）」 、「語義澄清（clarification requests）」、 「表達確定（confirmation checks）」。請問下列語言協商中，何者出現「表 達確定」類型？","o":["生：在印尼，哦，不是，在臺灣，是在臺灣，他得自己做這個事情，所以他有點 怕。 師：所以在臺灣，他得做所有的事情？","師：他的教授給他很多建議。 生：「建議」是什麼？ 師：「建議」是告訴他應該做什麼。","生：這個字的後面用不用「了」？ 師：你覺得需要不需要用「了」？","師：你覺得坐捷運有什麼好處？ 生：我覺得坐捷運不但方便而且也省錢。"],"a":"A"},{"n":6,"q":"美國外語教學協會提出的《21 世紀外語教學標準》核心內容是 5C，關於 5C 的敘述， 何者不合適？","o":["華語學習者應能透過學習華語來加強和擴展對世界的認識，學會從另一個視角來看 待同一個問題。此面向屬於語言比較（Comparisons）","華語學習者應能理解文化產物與文化觀念之間的關係。此面向屬於文化學習 （Cultures）","華語學習者應能夠傳達各種話題的訊息、概念或觀點給聽者或讀者。此面向屬於溝 通交流（Communication）","華 語 學 習 者 應 能 在 校 內 、 校 外 運 用 華 語 ， 終 身 學 習 。 此 面 向 屬 於 社 區 應 用 （Community）"],"a":"A"},{"n":7,"q":"華語教材應符合編寫原則，據此，下列描述何者正確？","o":["採用當前網路流行語為生詞的教材，符合時代原則","選用名篇為課文所編製而成的教材，符合實用原則","語言簡練流暢且沒有書面語的教材，符合語體原則","根據學習者需求分析而編寫的教材，符合目標原則"],"a":"D"},{"n":8,"q":"下列有關華語測驗與評量的敘述，何者正確？","o":["成就測驗（Achievement Test）的目標是想了解學生整體的華語能力","形成性評量（Formative Evaluation）多採量化方式評量學生最終的學習表現","能力測驗（Proficiency Test）是用來測量學生學習華語的能力，以預測將來成敗","總結性評量（Summative Evaluation）是學習成果的評定，多為定期舉行的正式考 試"],"a":"D"},{"n":9,"q":"下列各選項中之（）部分為該病句的偏誤類型分析，何者正確？","o":["「那本書被送給陳先生了」（誤代 misformation）","「他一到臺灣以後，就馬上來拜訪你」（誤加 addition）","「我們今天很高興地玩」（錯序 misordering）","「李小姐是一位老師，關於王先生，我就不清楚了」（遺漏 omission）"],"a":"B"},{"n":10,"q":"下列有關「情境教學法」 （Situational Language Teaching）的描述，何者正確？","o":["教學環境為非模擬的真實情境","先閱讀主題性資料再進行口語練習","提倡課前編寫進度表","以重複練習的方式學習句型結構"],"a":"C"},{"n":11,"q":"下列有關華語語音教學的相關現象，何者正確？","o":["外籍生洋腔洋調的主因來自於漢語標音系統的干擾","語音教學可用誇張法展示發音部位與發音方式，以放大語音特徵","聲調的性質取決於音高的變化，而音高的變化決定於舌位的高低","華語是聲調語言，故語音教學重點在聲、韻、調的訓練，而非語流"],"a":"B"},{"n":12,"q":"心理學研究指出，善用學習策略有助於第二語言學習。下列敘述何者錯誤？","o":["學習策略本身也是一種技能","學習策略跟一般技能不同，屬於隱性的程序知識，無須經由學習掌握","學習策略可進一步分為後設認知策略、認知策略和感情策略三種","學習策略內含訊息加工技能，不僅能擴大詞彙量，也能提升聽力理解和口語表達"],"a":"B"},{"n":13,"q":"閱讀教學的方法之一在於訓練學習者猜測聯想、跳躍障礙的技能，假使遇到生詞，如 「他看起來很成熟，可是想法卻很幼稚」句中不懂「幼稚」的意思，下列方法何者效 能最低？","o":["根據偏旁部首「禾」猜測「稚」字義","通過「幼」的語素義猜測「幼稚」詞義","根據上文詞語「成熟」相互解釋","根據關聯詞語「可是」理解句義"],"a":"A"},{"n":14,"q":"下列閱讀習慣何者需要及時糾正？","o":["一次多看幾個字，最好能整個短句的閱讀","先快速讀完整篇理清脈絡，再進一步讀重點","遇到生詞就馬上查閱詞典","遇到不懂的字詞，就先略過繼續往下讀"],"a":"C"},{"n":15,"q":"「習得需要的是在自然交際中用目的語進行有意義的交流和互動，教師糾錯、顯性教 學對語言習得沒有影響，因為習得的順序是固定不變的。」以上敘述屬於哪一個假說 的主張？","o":["輸入假說（The Input Hypothesis）","輸出假說（The Output Hypothesis）","注意力假說（The Noticing Hypothesis）","自然順序假說（The Natural Order Hypothesis）"],"a":"D"},{"n":16,"q":"在聽力訓練中，教師一般會使用精聽和泛聽兩種方式，這兩個方式的作用不同。以下 何者正確？","o":["課前預習應該採用精聽的方式進行","精聽的次數應該越多越好，直到學生都聽懂為止","泛聽的目的之一是為了訓練學生擷取大意的能力","泛聽之前應該把每個生詞先教授給學生，以免學生挫折"],"a":"C"},{"n":17,"q":"下列對中介語（interlanguage）的敘述，何者正確？","o":["中介語是教學使用的語言","中介語是一種過渡性的語言","中介語會逐漸地遠離目標語","中介語是已經固定不會改變的語言"],"a":"B"},{"n":18,"q":"這課討論的主題是婚姻。以下 a, b, c 是教師設計教案中的提問內容： a.課文中，爸媽過年要回哪裡？媽媽擔心什麼？ b.課文中，爸爸怎麼安慰？ c.你呢？過年時回家嗎？過年時做些什麼？家人會問東問西嗎？其他朋友呢？ 關於這三個提問的設計目的，下列敘述何者正確？","o":["a, b 的提問是為了複習重要句型","c 的提問是為了延伸學習，做文化比較","這三個提問的設計都是為了引起學習動機","這三個提問的設計都是為了確認學生對課文的理解"],"a":"B"},{"n":19,"q":"在編輯教材時，語法點的排序是一個重要考量。以下四種排法，哪一個不利學習？","o":["先教「嗎」，後教「吧」","先教「是……的」，後教動詞「是」 ，再教「把」字句","先教表示方位的「在」 ，後教帶有「威脅義」的「還」","先教表示「仍然義」的「還」"],"a":"B"},{"n":20,"q":"下列說法何者不是華語詞彙教學的主要目標？","o":["選用語用得體性詞語的能力","辨識詞、語素、短語的能力","掌握詞序的能力","分辨同音詞、同形詞、同義詞的能力"],"a":"C"},{"n":21,"q":"學生學了三年的中文， 「了」還是使用得不好。教師為了找出學生的問題，設計了 10 個是非題讓學生判斷合不合語法。這是屬於哪一種評量方式？","o":["寫作評量","總結性評量","形成性評量","診斷評量"],"a":"D"},{"n":22,"q":"下列華語教學的課後練習，要學生就□內左邊的漢字造詞，這個活動將兩個漢字放在 一組的目的，是為了加強學生對漢字哪一方面的辨識？ 搬 ______ 第 ______ 唱 ______ 住 ______ 盤 ______ 弟 ______ 喝 ______ 往 ______","o":["語音","構造","筆順","聲調"],"a":"B"},{"n":23,"q":"這是零程度學生的中文課。教師藉由圖片進行發音教學，一張圖片是「鼻子」、一張 圖片是「筆」 ，教師指著鼻子那張圖片唸「bí」 ，指著筆那張圖片唸「bǐ」 ；另一組圖片 是一塊「玉」和一條「魚」 。同樣的步驟，進行了幾組。這個活動的主要目的是什麼？","o":["讓學生認識拼音符號","讓學生知道聲母韻母的結合方式","讓學生意識到聲調不同，意義不同","讓學生感受漢語和其他語言的不同"],"a":"C"},{"n":24,"q":"語言學習依學生感官能力特長的不同，呈現不同的學習風格，下列敘述何者正確？ ，可採閱讀為主、語音為輔的施教方式","o":["針對視覺型學習者（Visual learner）","年紀越小越可能是聽覺型學習者（Aural learner），可採聽講或討論式教學","動覺型學習者（Kinesthetic learner）的感知敏銳，可記住別人所示範的細節","學習風格與生俱來，是個人偏好的學習方法，且不受後天環境影響而改變"],"a":"A"},{"n":25,"q":"外語學習理論中，將學習者的語言知識分為顯性語言知識和隱性語言知識兩種。下列 敘述何者正確？","o":["語感屬於隱性語言知識","顯性語言知識是指內化了的語言知識","日期、姓名、電號號碼和地址等等是隱性知識","目標語中的語音、語法、詞彙等知識屬於隱性語言知識 ※下列是非題請在答案卡上以 2B 鉛筆作答"],"a":"A"}],"2019":[{"n":1,"q":"國際上有許多測驗語言的考試，如：臺灣的 TOCFL 或是中國大陸的 HSK，請問這類 的考試屬於：","o":["成績測試","能力測試","診斷測試","潛能測試"],"a":"B"},{"n":2,"q":"對比分析產生於 20 世紀 50 年代，興起於 60 年代，代表人物為美國的 Lado。請問這 項理論的作用和目的是？","o":["將學習者與母語相聯繫的文化遷移到第二語言系統中。","學習者將課堂語言知識反應在學習過程上，並受外在大綱支配。","預測哪些語言現象會在第二語言學習中對學生造成困難，並對學生已出現的錯誤加 以分析和解釋。","揭示學習者的中介語體系，從而瞭解第二語言習得的過程與規律。"],"a":"C"},{"n":3,"q":"偏誤分析產生於 20 世紀 60 年代，興盛於 70 年代，代表人物是英國的 Corder。請問所 謂的偏誤（error）和錯誤（mistake）有何區別？","o":["偏誤相當於「口誤」、 「筆誤」 ，如：說錯人名；錯誤是反映了說話者的語言能力和 水準。","偏誤具有規律性、系統性；錯誤是零星、沒有規律。","偏誤是指目的語與母語結構特徵形似；錯誤是指目的語與母語結構特徵有差異。","兩者意思相同，並無區別。"],"a":"B"},{"n":4,"q":"語言教學法各有所異，請針對下列論述找出最適當的教學法定義： 「以說故事的方式讓 學生習得語言，通過故事讓學生掌握關鍵詞和理解故事內容，並對連環圖畫進行複述」 。","o":["全身反應法","聽說型教學法","任務型教學法","行為情境教學法"],"a":"D"},{"n":5,"q":"以下何者不是中介語（interlanguage）所能直接觀察出來的？","o":["學習者的語言變異","學習者的語言偏誤","學習者的語言產出能力","學習者的理解能力"],"a":"D"},{"n":6,"q":"關於語言習得理論，下列學者和所主張的觀點，配對正確的是？","o":["Piaget 強化論（reinforcement theory）行為主義刺激-反應。兒童說話是基於對成人 的話語做出反應，反應正確就有獎賞，使之受到強化並形成習慣。","Chomsky 內在論（innate theory）認為兒童天生具有語言習得機制（language acquisition device），使其能對接觸的語言進行處理，強調規律的內在化。","Osgood 認知論（cognitive theory）主張語言學習與遺傳心理有關，取決於天生能力， 人向環境學習產生語言。","Vygotsky 環境理論（theory of environment）主張語言習得與環境有關。 （meaningful learning）應用於第二語言教學，以下敘述哪一"],"a":"B"},{"n":7,"q":"Ausubel「有意義的學習」 個是正確的？","o":["教學活動設計應配合學生的能力和經驗。","教材的主題或內容應該取材自學生過往的人生經歷。","詞彙教學應先告知詞條的意思。","教師在教學時應避免使用學生的母語，使學生沉浸於目標語的環境。"],"a":"A"},{"n":8,"q":"「由上而下」和「由下而上」是聽解的兩個重要過程。以下何者是「由上而下」的技 巧？","o":["注意句子的結構。","找出言談標記。","掌握語音的解碼。","區別輕重音和語氣。"],"a":"A"},{"n":9,"q":"「衣服你昨天買很好看。」、 「車子的我哥哥很貴。」這兩個句子最可能的偏誤原因是 下列哪一選項？","o":["語體誤判","母語影響","目標語過度類化","溝通策略"],"a":"B"},{"n":10,"q":"以下關於「字本位」的詞彙教學，何者正確？","o":["以詞條為單位。","容易與口語結合。","重視組成詞的個別字義。","先教高頻詞。"],"a":"C"},{"n":11,"q":"有關華語學習者在第二語言（Chinese as a Second Language, CSL）或外語（Chinese as a Foreign Language, CFL）的環境中習得目標語，下列敘述何者正確？","o":["CSL 的學習者多來自相同的母語背景。","CFL 大多是以目標語授課的沉浸式教學。","CSL 比 CFL 的學習者更容易融入目標語社會。","CFL 比 CSL 的學習者更常出現母語弱化的現象。"],"a":"C"},{"n":12,"q":"「關鍵期假說」 （the critical period hypothesis）主張「人類習得語言的關鍵時間大約在 青春期以前」 。關於關鍵期與第二語言習得，下列敘述何者正確？","o":["不同年齡間的兒童，第二語言習得的情形並無不同。","兒童及成人的第二語言習得變項太多，不應加以比較。","關鍵期以前的學習者，較可習得像母語人士一樣的口音。","關鍵期以後大腦側化，右腦不再參與第二語言習得。"],"a":"C"},{"n":13,"q":"部件是組成漢字的零件，有關漢字部件的說法，下列何者正確？","o":["「成字部件」指的是合體字。","「不成字部件」指的是偏旁、部首。","部件分析對字義、字音的探討不具作用。","「立早章」、 「言午許」都是利用漢字部件說解漢字。"],"a":"D"},{"n":14,"q":"下列關於「溝通式教學法」（communicative language teaching）的敘述何者正確？","o":["語言形式結構的正確性比流暢性更重要。","課堂以目標語溝通，不使用母語與翻譯。","教材教法重視語言使用的靈活性。","閱讀寫作應與口語練習同時進行。"],"a":"C"},{"n":15,"q":"「他不喜歡學習，而很快快樂樂地學中文在臺灣」是一個混合偏誤的病句，下列何者 不是這個病句的偏誤形式？","o":["遺漏（omission）","誤加（addition）","誤代（mis-selection）","錯序（misordering）"],"a":"A"},{"n":16,"q":"以下關於第二語言學習之敘述，何者為非？","o":["大量接觸第二語言，兒童在語言使用的準確性上更具優勢。","兒童在還沒有完全掌握母語時，有可能採母語學習方式來學習第二語言。","從學習效率來衡量，青少年期才是學習第二語言的最佳時期。","青春期後才開始第二語言學習，其外語也可能達到極高水準。"],"a":"A"},{"n":17,"q":"有關閱讀技巧的方法，美國學者 Robinson 提出 SQ3R。S 為綜覽（Survey） 、Q 為提問 （Question），另外所謂的 3R 不包含下列何者？","o":["Reading 進行實際閱讀。","Review 根據記憶對閱讀內容進行複習。","Reward 對閱讀後的成效進行評估與獎勵。","Recite 根據記憶對閱讀材料進行重組（reconstruct）。"],"a":"C"},{"n":18,"q":"下列學習者狀況，TOCFL 入門基礎級對象是？","o":["具備 2,500-5,000 個詞彙量。","非華語地區學習 60-240 小時。","在臺灣學習華語的時數達 360-960 小時。","具備基本語法及 500-1,000 個基礎詞彙量。"],"a":"D"},{"n":19,"q":"華語測驗命題時，下列選項何者錯誤？","o":["選項彼此之間應該具備邏輯上的關聯。","好的測驗題目必須注意難度、鑑別度和誘答力。","每個試題只問一個獨立而明確的問題，避免同時包含太多概念。","題幹應儘量採正面敘述，若使用否定句，必須在否定字眼下加註底線。"],"a":"A"},{"n":20,"q":"Bennett 認為應重視語言教學中的文化內涵，最有效的方法是「文化比較法」 。下列敘 述何者正確？","o":["透過比較學習，最後理解接受 C2 文化。","必須達到一定語言程度，才能理解 C2 文化。","先讓學生瞭解 C2 的價值觀、思想模式與社會行為。","比較 C1 與 C2，特別強調 C2 中那些 C1 所沒有的概念。"],"a":"C"},{"n":21,"q":"以下關於普遍語法（universal grammar）的敘述，何者有誤？","o":["屬於天生的語言學習機制。","幼兒大腦能將吸收進來的語言加以歸納。","幼兒在學習語言的過程中，不會出現前所未聞的錯誤語句。","是喬姆斯基（Noam Chomsky）所提出的。"],"a":"C"},{"n":22,"q":"林老師在教學生沒見過的詞彙「雛鳥」時，說出「幼小的鳥」來幫助學生理解，這種 教學策略稱之為：","o":["上下關聯法","新舊關聯法","聯想法","對比法"],"a":"B"},{"n":23,"q":"許多學者認為語法教學必須有排序性，對於語法點的難易度評定，下面哪一個原則是 錯誤的?","o":["語意越複雜，困難度越高。","語用功能越低，困難度越高。","越不易類化者，困難度越高。","跨語言差距越大，困難度越高。"],"a":"B"},{"n":24,"q":"以下有關「客人來了」和「來客人了」的比較，何者敘述最不適當？","o":["兩者的信息結構不同","兩者的論元結構不同","兩者的語用情境不同","兩者的語意不同"],"a":"B"},{"n":25,"q":"每一種教學法都有其優缺點，下面哪一個敘述是對的？","o":["視聽教學法透過口語練習的方式習得外語。","溝通式教學法重視語言的準確度更勝於流暢度。","自然教學法鼓勵學生在對談中使用句子和生詞，重視準確度。","文法翻譯法最受到批評的部分是不注重書寫能力。 ※下列是非題請在答案卡上以 2B 鉛筆作答"],"a":"A"}],"2020":[{"n":1,"a":"B","q":"關於人類的語言習得，下列敘述何者最適當？","o":["Krashen 的習得／學習假說，主張第二語言的流利度在學習而不在習得。","Lado 的對比分析理論，認為第二語言習得的障礙來自第一語言的干擾。","Long 的互動假說，著重於研究學習者對情境意義理解與掌握的過程。","Rogers 的建構學派學習理論，關注學習者的認知過程，而非情境脈絡。"]},{"n":2,"a":"D","q":"下列何者不是 Krashen 第二語言習得理論的主要假說？","o":["語言學習與語言習得是相近但有差別的概念。","第二語言學習在學習詞彙及語法方面有其自然之順序。","二語學習者的情緒和壓力會影響學習成效。","監控假說（Monitor Hypothesis）認為後天習得的語言系統可以引領學習者自然開口使用語言。"]},{"n":3,"a":"B","q":"李老師認為二語學習初期階段會有一段沈默期，而且在課堂上進行有意識的語言規則教學與學習才是真正的學習過程。請問李老師的教學觀最趨近下列哪一個選項？","o":["自然順序假說與情感過濾假說","輸入假說與習得／學習假說","自然教學法與偏誤分析","關鍵期假說與監控假說"]},{"n":4,"a":"B","q":"在溝通式教學的語言課堂裡，適當的操練（drill）也有其必要性。在溝通式教學課堂中，下列操練的原則何者最不適當？","o":["節奏儘量快速活潑","整合聽說讀寫四種技能","要讓學生明白練習的意義","要確定最終的目標是溝通"]},{"n":5,"a":"C","q":"張老師在「漢字藝術—書法練習」單元將「把」字句融入其中，請同學「把筆放在中指和無名指之間」、「把手向上輕抬起筆」……。以上教學設計，最趨近下列何種教學法？","o":["暗示教學法","團體語言教學法","肢體反應教學法","溝通式教學法"]},{"n":6,"a":"A","q":"關於「沉浸式教學（Immersion Program）」的概念，下列敘述何者最不適當？","o":["非雙語教育，不允許同時使用學生母語，使學生自然沉浸在第二語言的情境中。","學習型態是以內容為主的教學方式（Content-Based Instruction）。","部分沉浸式教學可指一半的時間使用目標語，另一半時間使用學習者的第一語言。","沉浸式的課程和第一語言的課程平行並進。"]},{"n":7,"a":"C","q":"下列特徵何者出現時，最適合應用注重形式的教法（Form-Focused Instruction）？","o":["第一與第二語言明顯不同的特徵","規則常見的特徵","在第二語言不易察覺的特徵","有重要溝通功能的特徵"]},{"n":8,"a":"A","q":"有名外籍學生在臺灣學習華語一年，他的個性外向，和班上的其他同學互動熱絡。上課時每當老師提問他總是搶著回答，有時也會主動要求老師問他問題。學習漢字時，他希望老師可以多解釋漢字的部首偏旁以幫助他學習更多漢字。這名學生有很多臺灣朋友，經常從朋友那裡學到日常的口語表達。他也喜歡在臺灣的生活，他說未來考慮移民臺灣，所以一定要把華語學好。關於這名學生特質的敘述，下列何者最不適當？","o":["學習動機為工具性傾向（instrumental orientation）","學習風格屬場域獨立（field independence）","是衝動型（impulsivity）的學習者","使用認知策略（cognitive strategy）學習漢字"]},{"n":9,"a":"C","q":"關於華語課堂的寫作活動，下列敘述何者最適當？","o":["抄寫的作用在習得漢字而不是句子結構。","聽寫適合中高級以上的程度，不適用於初級階段。","控管式的寫作目的在檢驗學習結果，不能自由創作。","對話式的日誌是純粹的自我寫作，不適用於課堂活動。"]},{"n":10,"a":"A","q":"關於華語課堂常見的教學方法，下列敘述何者最適當？","o":["演繹法—先呈現語法規則，再提供例句說明語法的方法","關聯法—將目標語與學習者母語語法規則做對比的方法","歸類法—先提供例句，讓學習者從例句中概括出結論的方法","對比法—將零散無序的句式按照功能或結構排比的方法"]},{"n":11,"a":"A","q":"進行華語聽力教學時，教師在學生開始聽文本以前先提出問題，讓學生一邊聽、一邊尋求答案。關於這項訓練的重點，下列選項何者最不適當？","o":["增強聽後模仿力","訓練集中注意力","提高檢索監聽力","強化關鍵詞辨別力"]},{"n":12,"a":"D","q":"林老師在華語課堂上介紹一個漢字的六書屬性，說明其從甲骨文、金文、小篆到楷書的變化，並解釋其本義及引申義。請問上述教學內容最趨近下列何者漢字教學技巧？","o":["漢字展示技巧","漢字辨識技巧","漢字練習技巧","漢字詮釋技巧"]},{"n":13,"a":"B","q":"漢字教學時可透過加強學生認識記憶「部件」空間的規律進行教學。下列選項中的漢字部件空間原則，何者與其他相異？","o":["蓋","朋","查","等"]},{"n":14,"a":"A","q":"依據「心、雨、果」等漢字的文字特質，使用下列何種漢字教學法最適當？","o":["字源教學法","字族教學法","部件教學法","邏輯教學法"]},{"n":15,"a":"D","q":"關於華語詞彙教學中的詞彙重現，下列敘述何者最不適當？","o":["George Miller 提出人類學習詞彙時，記憶容量的上下限為 7±2。","心理學家認為按照遺忘速度先快後慢的規律，學生當天學過的生詞，在此後的第 2、4、7、12 天重現最有利於記憶。","一個新詞至少要重現六至八次，學習者才能初步掌握。","學習過的詞彙不需以形音義結合體出現，以加強學生在不同協作方面的刺激。"]},{"n":16,"a":"B","q":"華語教師可以引導學生利用已經學過的漢語詞彙嘗試解釋新詞詞義，然後再予以歸納新詞詞義。下列的教學引導何者最適當？","o":["使用「幾乎」來解釋新詞「簡直」","使用「正好」來解釋新詞「恰巧」","使用「原先」來解釋新詞「一再」","使用「一直」來解釋新詞「一連」"]},{"n":17,"a":"C","q":"華語教師宜了解不同母語者於華語學習上的難點，以利進行教學設計。就語言對比而言，英語母語者在學習華語發音時，下列選項中最感困難者為何？","o":["聲母","韻母","聲調","輕重音"]},{"n":18,"a":"BD","q":"關於華語教學中語法教學的基本知識，下列敘述何者最適當？","o":["量詞可分為「個、張、把、支」等動量詞與「趟、回、遍、下」等名量詞。","名詞沒有「數」（number）、「性」（gender）、「格」（case）的變化。","動詞無「時貌」（aspect）、「時式／時態」（tense）的標誌。","漢語為主題顯著的語言（Topic-Prominent），因此主語（subject）在句中常可省略。"]},{"n":19,"a":"C","q":"下列「中介語」（Interlanguage）產生的方式，何者最不適當？","o":["語言轉移","虛詞（function word）省略","語言習得的正遷移（positive transfer）","第二語言的學習策略"]},{"n":20,"a":"D","q":"下列何種教學法視語言為一個整體的溝通系統，主張語言教師應進行聽、說、讀、寫四種技能的整合，而不是將語言切割成不同技能再分別教導？","o":["直接教學法（Direct Method）","聽說教學法（Audiolingual Method）","認知學習法（Cognitive Code Learning）","全語言教學法（Whole Language Approach）"]},{"n":21,"a":"A","q":"從社會語言學的角度觀之，下列選項何者與華語教學最不相關？","o":["方言變遷","風俗習慣","語言場合","成語文化"]},{"n":22,"a":"B","q":"下列選項中各病句的偏誤類型分析，何者最適當？","o":["今天天氣不錯，很合理去海邊。（誤加）","這兩天我沒有時間，我要做多事。（遺漏）","他喜歡運動，他游泳很好。（錯序）","我很餓，所以先點兒東西吃了。（誤代）"]},{"n":23,"a":"B","q":"關於溝通式教學法為本的詞彙教學原則，下列敘述何者最不適當？","o":["幫助學生在上下文之中學詞彙","建議學生背誦字典中的字詞","鼓勵學生利用字詞的線索來猜測詞意","隨機進行詞彙教學，不事先預定詞彙"]},{"n":24,"a":"C","q":"王老師發現某學生在華語發音方面出現問題，他想了解問題所在，所以將學生做發音測驗以做為課程設計的依據。請問此發音測驗應為下列何者？","o":["性向測驗（Aptitude Test）","語言能力測驗（Proficiency Test）","診斷測驗（Diagnostic Test）","成就測驗（Achievement Test）"]},{"n":25,"a":"C","q":"陳老師認為華語教材編寫要考量第二語言學習者的需求分析及文化背景，而且必須要納入新理論和觀念來支持教材的組織和安排，使教材具長久使用的價值以符合第二語言教學的規律。請問陳老師的教材編寫理念最趨近下列哪一個原則？","o":["文化原則","認知原則","特色原則","語體原則"]}]}, SCANS=[];let year='2016',mode='study',index=0;const MIXKEY='huayu_mixed50_v1';let mixed=[];let mixedRecords={};let mixedRevealed=false;function makeMixed(){let arr=[];Object.keys(DATA).forEach(y=>{let pool=DATA[y].map(q=>({...q,year:y}));for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}arr.push(...pool.slice(0,10))});for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.map(q=>({...q,id:q.year+'-'+q.n}))}try{let state=JSON.parse(localStorage.getItem(MIXKEY)||'null');if(state&&Array.isArray(state.ids)&&state.ids.length===50){mixed=state.ids.map(id=>{let [y,n]=id.split('-');let q=DATA[y]?.find(q=>q.n===Number(n));return q?{...q,year:y,id}:null}).filter(Boolean);mixedRecords=state.records||{}}}catch(e){}if(mixed.length!==50){mixed=makeMixed();mixedRecords={}}function saveMixed(){try{localStorage.setItem(MIXKEY,JSON.stringify({ids:mixed.map(q=>q.id),records:mixedRecords}))}catch(e){}}saveMixed();const QSCANS={};const $=id=>document.getElementById(id);

let retryRecords={},chosen='',examRevealed=false;
const answerKey=q=>isMixed()||isWrong()?uid(q):q.n;
const activeRecords=()=>isWrong()?retryRecords:isMixed()?mixedRecords:records;
const saveActive=()=>{if(isWrong())return;if(isMixed())saveMixed();else save()};
const EXPLAIN={
'2016-1':{body:'關鍵是「察覺」及「輸入轉成吸收（intake）」。Schmidt 的注意力假說主張，學習者注意到輸入中的語言形式，才能使該部分輸入成為可供習得的 intake。A 語言輸入假說著重可理解輸入；B 語言輸出假說著重輸出的學習作用；D 自然順序假說著重語言形式的習得順序。這是對 Schmidt 理論主張的辨識，不代表學界對「察覺是否絕對必要」沒有爭論。',refs:[['Schmidt（1990），Applied Linguistics 原始論文','https://academic.oup.com/applij/article-abstract/11/2/129/163482'],['Robinson（1995），Language Learning 學術評述','https://doi.org/10.1111/j.1467-1770.1995.tb00441.x']]},
'2020-24':{body:'題目要找出學生「發音方面出現問題」的具體原因，並將結果作為課程設計依據，因此是診斷測驗。性向測驗偏向預測學習潛能；語言能力測驗評估較廣泛的語言能力；成就測驗衡量特定課程或教學後的學習成果。',refs:[['紐西蘭教育部：語言教學的診斷性評量','https://seniorsecondary.tki.org.nz/Learning-languages/Pedagogy/Assessment-for-learning/Diagnostic'],['Cambridge University Press：語言評量的診斷功能','https://assets.cambridge.org/97810094/68152/excerpt/9781009468152_excerpt.pdf']]}
};
function refreshBank(){let qs=bankQuestions();$('bankCount').textContent=qs.length+' 題';$('bankList').innerHTML=qs.length?qs.map(q=>`<div class="bankrow"><div><b>${q.year} 年・第 ${q.n} 題</b><div class="mini">${esc(q.q||'掃描版原始試題')}</div></div><button data-id="${uid(q)}">重做</button></div>`).join(''):'<p class="muted">目前還沒有錯題。答錯的題目會自動加入。</p>';document.querySelectorAll('#bankList button').forEach(b=>b.onclick=()=>{mode='wrong';$('mode').value='wrong';retryRecords={};index=Math.max(0,bankQuestions().findIndex(q=>uid(q)===b.dataset.id));$('year').disabled=true;$('reshuffle').classList.add('hide');$('quiz').scrollIntoView({behavior:'smooth'});render()});}
function render(){refreshBank();let qs=items();$('year').disabled=isMixed()||isWrong();$('reshuffle').classList.toggle('hide',!isMixed());if(!qs.length){$('quiz').classList.add('hide');$('numbers').innerHTML='';$('count').textContent='0/0';$('accuracy').textContent='—';$('misses').textContent='0';return}$('quiz').classList.remove('hide');index=Math.min(index,qs.length-1);let q=qs[index],rr=activeRecords(),rec=rr[answerKey(q)],done=qs.filter(x=>rr[answerKey(x)]).length,good=qs.filter(x=>correct(x,rr[answerKey(x)])).length;
$('count').textContent=done+'/'+qs.length;$('accuracy').textContent=done?Math.round(good/done*100)+'%':'—';$('misses').textContent=bankQuestions().length;
$('qtitle').textContent=(isMixed()?'混合練習｜第 '+(index+1)+' / 50 題':isWrong()?'錯題重練｜第 '+(index+1)+' / '+qs.length+' 題':year+' 年｜第 '+q.n+' 題');$('tag').textContent=(q.year||year)+' 年第 '+q.n+' 題';$('bar').style.width=((index+1)/qs.length*100)+'%';
$('stem').innerHTML=q.q?esc(q.q):'<div class="scan-note">2020 年第 '+q.n+' 題・單題原始影像（可放大檢視）</div><a href="'+QSCANS[q.n]+'" target="_blank" title="點擊放大試題"><img class="scan" alt="2020年第'+q.n+'題原題影像" src="'+QSCANS[q.n]+'"></a>';
chosen=rec||'';$('choices').innerHTML='';['A','B','C','D'].forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.dataset.v=v;b.innerHTML='<strong>('+v+')</strong> '+(q.o?esc(q.o[i]):'（請對照上方原題選項）');b.onclick=()=>{if(mode!=='exam'&&rec)return;chosen=v;if(mode==='exam'){records[q.n]=v;save()}renderChoices()};$('choices').append(b)});renderChoices();
$('prev').disabled=index===0;$('next').disabled=index===qs.length-1;$('numbers').innerHTML='';qs.forEach((x,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className='num'+(rr[answerKey(x)]?(correct(x,rr[answerKey(x)])?' done':' wrong'):'')+(i===index?' current':'');b.onclick=()=>{index=i;render()};$('numbers').append(b)});
}
function renderChoices(){let q=items()[index],rec=activeRecords()[answerKey(q)],reveal=mode==='exam'?examRevealed:!!rec;document.querySelectorAll('.choice').forEach(b=>{let v=b.dataset.v;b.className='choice'+(chosen===v?' sel':'')+(reveal&&q.a.includes(v)?' good':'')+(reveal&&rec===v&&!correct(q,v)?' bad':'')});$('feedback').classList.toggle('hide',!reveal);if(reveal){let ex=EXPLAIN[uid(q)];$('feedback').innerHTML='<b>'+(correct(q,rec)?'答對了！':'答錯了。')+'</b> 官方答案：'+q.a.split('').join(' 或 ')+(uid(q)==='2020-18'?'<p>2020 年官方第二次公告：B 或 D 均可。</p>':'')+'<hr><b>解析與查證</b>'+(ex?'<p>'+esc(ex.body)+'</p><div class="mini">查證資料：官方解答＋下列學術／教育來源</div><ul>'+ex.refs.map(r=>'<li><a href="'+r[1]+'" target="_blank" rel="noopener">'+esc(r[0])+'</a></li>').join('')+'</ul>':'<p>本題官方答案已核對；詳細解析尚未完成多方來源查證，因此暫不提供推測性解釋。</p>');}
$('submit').textContent=mode==='exam'?(examRevealed?'重新開始模擬考':'交卷並批改'):rec?'已批改':'確認答案';$('submit').disabled=mode!=='exam'&&(!!rec||!chosen);
}
function recordWrong(q,v){let id=uid(q);if(!correct(q,v)){wrongBank[id]=wrongBank[id]||{added:Date.now(),attempts:0};wrongBank[id].attempts++}else if(isWrong()){delete wrongBank[id]}persistWrong()}
$('submit').onclick=()=>{if(mode==='exam'){if(examRevealed){if(!confirm('重新開始模擬考並清除本年份作答？'))return;records={};save();examRevealed=false;render();return}if(!confirm('確定交卷？'))return;examRevealed=true;let qs=items(),good=0;qs.forEach(q=>{let v=records[q.n];if(correct(q,v))good++;else if(v)recordWrong(q,v)});alert('模擬考成績：'+good*2+' / 50 分');render();return}if(!chosen)return;let q=items()[index];activeRecords()[answerKey(q)]=chosen;recordWrong(q,chosen);saveActive();render()};
$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=()=>{index=Math.min(items().length-1,index+1);render()};
$('year').onchange=e=>{year=e.target.value;index=0;examRevealed=false;try{records=JSON.parse(localStorage.getItem(key(year))||'{}')}catch(e){records={}}render()};
$('mode').onchange=e=>{mode=e.target.value;index=0;examRevealed=false;if(isWrong())retryRecords={};render()};
$('reset').onclick=()=>{if(isWrong()){retryRecords={};index=0;render();return}if(isMixed()){if(confirm('清除本次混合練習的作答紀錄？（不影響錯題庫）')){mixedRecords={};saveMixed();index=0;render()}return}if(confirm('清除 '+year+' 年的本次作答紀錄？（不影響錯題庫）')){records={};save();index=0;examRevealed=false;render()}};
$('reshuffle').onclick=()=>{if(confirm('重新抽取50題？本次混合練習作答紀錄會清除，錯題庫保留。')){mixed=makeMixed();mixedRecords={};saveMixed();index=0;render()}};
Object.keys(DATA).forEach(y=>$('year').add(new Option(y+' 年',y)));
$('clearBank').onclick=()=>{if(confirm('確定清空全部錯題庫？此動作無法復原。')){wrongBank={};persistWrong();retryRecords={};index=0;render()}};
render();
</script></html>
